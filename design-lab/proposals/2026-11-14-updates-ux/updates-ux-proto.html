      sections: [
        ['What VESSEL is', 'VESSEL (Virtual Ecosystem for System Simulation & Enterprise Logistics) is a TWINS project. Students research, design and simulate an end-to-end manufacturing and supply-chain system with discrete-event simulation or digital-twin software.', true],
        ['The engineering goal', "Turn each stage of that value stream into a working simulation. Students define operating parameters such as equipment capacity, cycle time, setup time, labor, energy use, material flow, defect rates, maintenance, inspection, inventory policy, packaging and transport limits. The model produces synthetic production data like a real factory's."],
        ['Why it is different', 'Most projects study manufacturing, quality, operations and logistics separately. VESSEL asks how a decision in one stage changes the rest: teams compare production philosophies, find bottlenecks, investigate defects, balance capacity, cut waste and redesign workflows, then measure cost, throughput, utilization, inventory, lead time, sustainability, quality and delivery.']
      ] },
    { slug: 'samsung-financial-reporting-case-study', title: 'Samsung financial reporting case study', type: 'Case study', tag: 'business', date: '2026-08-19',
      summary: "Samsung's legally distinct affiliates move value through documented transactions. This study turns that model into a proposed finance system for the club.",
      authors: ['Christian Bautista', 'Russell Chung'], mentors: ['Russell Chung'] },
    { slug: 'fifo-ip-v3', title: 'FIFO IP v3: learning how to approach the unknown', type: 'Milestone', tag: 'sidekick', detail: 'SoC', date: '2026-04-30',
      summary: 'With little Verilog or FPGA experience, the team built a FIFO step by step.',
      authors: ['Sami Ali', 'Ethan Oliver Wong', 'Jeremy Lee'], mentors: ['Russell Chung', 'Chris Zambrana'] },
    { slug: 'fifo-ip', title: 'FIFO IP: reliable data flow in digital systems', type: 'Milestone', tag: 'sidekick', detail: 'SoC', date: '2026-03-23',
      summary: 'A parameterized FIFO buffer designed and verified in Vivado, so parts on different clocks can pass data safely.',
      authors: ['Ethan Trone', 'Allen Nguyen'], mentors: ['Anish Chinnakonda', 'Chris Zambrana'] },
    { slug: 'light-sensor-mini-project', title: 'Light sensor mini-project', type: 'Prototype', tag: 'sidekick', detail: 'Hardware', date: '2026-01-22',
      summary: 'An ambient light and proximity sensor board for automatic screen brightness, designed in KiCad.',
      authors: ['Logan Knip'], mentors: ['Ethan Oliver Wong', 'Max Gross', 'Angelo Duenas'] },
    { slug: 'smartphone-enclosure', title: 'Smartphone enclosure: ergonomics and iterative CAD', type: 'Prototype', tag: 'sidekick', detail: 'Enclosure', date: '2026-01-21',
      summary: 'The team iterated enclosure concepts around module and battery thickness, grip and manufacturability.',
      authors: ['Russell Chung', 'Logan Knip', 'Izaiah Ortiz'], mentors: [], lead: 'Viren Kumar' },
    { slug: 'imu-mini-project', title: 'IMU mini-project', type: 'Prototype', tag: 'sidekick', detail: 'Hardware', date: '2025-11-25',
      summary: 'A 9-axis motion sensor board for the phone daughterboard, from decision matrix to KiCad layout.',
      authors: ['Allen Nguyen', 'Oscar Cao', 'Mason Tran'], mentors: ['Max Gross'] }
  ];
  var TAGS = [['sidekick', 'SIDEKICK'], ['shades', 'SHADES'], ['brain', 'BRAIN'], ['twins', 'TWINS', true], ['business', 'DIGITAL Business', true]];
  var TAG_LABEL = Object.fromEntries(TAGS);
  var state = { tag: null, type: null, q: '', more: false };

  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var d = function (iso) { return new Date(iso + 'T00:00:00'); };
  var fmt = function (iso, noYear) { return d(iso).toLocaleDateString('en-US', noYear ? { month: 'short', day: 'numeric' } : { year: 'numeric', month: 'short', day: 'numeric' }); };
  var initials = function (n) { return n.split(/[\s-]+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase(); };
  var chip = function (p) { return '<span class="tag" data-tag="' + p.tag + '"><span class="tagChip">' + esc(TAG_LABEL[p.tag]) + '</span></span>'; };
  var href = function (p) { return p.site ? '#post' : '#index'; };
  var out = function (p) { return p.site ? '' : '<span aria-hidden="true"> ↗</span><span class="srOnly"> (opens LinkedIn)</span>'; };
  var byline = function (p) {
    return '<p class="byline"><span class="srOnly">By </span><span class="stack" aria-hidden="true">' +
      p.authors.slice(0, 4).map(function (n) { return '<span class="av">' + initials(n) + '</span>'; }).join('') +
      '</span><span class="names"><span class="authors">' + esc(p.authors.join(', ')) + '</span>' +
      (p.mentors.length ? ' · Mentor ' + esc(p.mentors.join(', ')) : '') + (p.lead ? ' · Lead ' + esc(p.lead) : '') + '</span></p>';
  };
  var metaLine = function (p) { return (p.detail ? p.detail + ' · ' : '') + p.type + ' · ' + fmt(p.date); };

  function card(p, lead) {
    var art = lead && p.flow ? '<div class="art" aria-hidden="true"><ol class="artFlow">' + p.flow.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ol></div>' : '';
    return '<article class="card' + (lead ? ' leadCard' + (art ? '' : ' textOnly') : '') + '">' + art + '<div class="cardCopy">' + chip(p) +
      '<span class="meta">' + esc(metaLine(p)) + '</span>' +
      '<h2 class="' + (lead ? 'leadTitle' : 'cardTitle') + '"><a class="cardLink" href="' + href(p) + '">' + esc(p.title) + '</a></h2>' +
      '<span class="cardSummary">' + esc(p.summary) + '</span>' + byline(p) +
      '<span class="src">' + (p.site ? 'On this site' : 'LinkedIn' + out(p)) + '</span></div></article>';
  }
  function row(p, noYear) {
    return '<li class="row"><time class="meta" datetime="' + p.date + '">' + fmt(p.date, noYear) + '</time><span>' + chip(p) + '</span>' +
      '<div class="rowBody"><span class="rowTitle"><a class="rowLink" href="' + href(p) + '">' + esc(p.title) + out(p) + '</a><span class="meta">' + esc(p.type) + '</span></span>' +
      '<p class="rowSummary">' + esc(p.summary) + '</p>' + byline(p) + '</div></li>';
  }

  function index() {
    var needle = state.q.trim().toLowerCase();
    var hits = POSTS.filter(function (p) {
      return (!state.tag || p.tag === state.tag) && (!state.type || p.type === state.type) &&
        (!needle || [p.title, p.summary, TAG_LABEL[p.tag], p.type].concat(p.authors, p.mentors).some(function (f) { return f.toLowerCase().indexOf(needle) > -1; }));
    });
    var count = function (k, v) { return POSTS.filter(function (p) { return p[k] === v; }).length; };
    // Astryx BlogIndex: only types that have posts get a filter button.
    var types = POSTS.map(function (p) { return p.type; }).filter(function (t, i, a) { return a.indexOf(t) === i; });
    var active = (state.type ? 1 : 0) + (needle ? 1 : 0);

    var filters = '<nav class="filters" aria-label="Filter updates"><div class="group" role="group" aria-label="Tags">' +
      '<button type="button" class="pill" data-k="tag" data-v="" aria-pressed="' + (!state.tag && !state.type) + '">All</button>' +
      TAGS.map(function (t) {
        var n = count('tag', t[0]);
        // Head Designer 2026-11-14: hide tags with 0 posts, no "soon" marker.
        return n ? '<button type="button" class="tag lg" data-tag="' + t[0] + '" data-k="tag" data-v="' + t[0] + '" aria-pressed="' + (state.tag === t[0]) + '"><span class="tagChip">' + t[1] + ' <span class="n">' + n + '</span></span></button>' : '';
      }).join('') + '</div>' +
      '<details class="more"' + (state.more ? ' open' : '') + '><summary>Type and search' + (active ? ' <span class="n">' + active + '</span>' : '') + '</summary><div class="moreBody">' +
      '<div class="group" role="group" aria-label="Type">' + types.map(function (t) {
        return '<button type="button" class="pill" data-k="type" data-v="' + t + '" aria-pressed="' + (state.type === t) + '">' + t + ' <span class="n">' + count('type', t) + '</span></button>';
      }).join('') + '</div>' +
      '<div class="search"><label class="srOnly" for="q">Search updates</label><input id="q" class="control" type="search" placeholder="Search updates" autocomplete="off" value="' + esc(state.q) + '"></div>' +
      '</div></details>' +
      '<p class="meta status" role="status">' + (hits.length ? hits.length + (hits.length === 1 ? ' update' : ' updates') : (state.tag && !state.type && !needle ? 'No updates with this tag yet.' : 'No updates match these filters.')) + '</p></nav>';

    var cards = hits.length ? '<div class="cards" role="group" aria-label="Featured">' + card(hits[0], true) + hits.slice(1, 4).map(function (p) { return card(p); }).join('') + '</div>' : '';

    // IDEA 1: rows are only the posts the cards did not show, under a year label.
    var rest = hits.slice(4), log = '';
    if (rest.length) {
      log = '<h2 id="earlier" class="h2">Earlier</h2>';
      rest.forEach(function (p, i) {
        var y = p.date.slice(0, 4);
        if (!i || rest[i - 1].date.slice(0, 4) !== y) log += (i ? '</ul>' : '') + '<h3 class="year meta">' + y + '</h3><ul class="rows">';
        log += row(p, true);
      });
      log += '</ul>';
    }
    return '<section class="section head"><div class="wrap"><h1 class="title enter">Updates</h1><p class="lead enter">Papers, milestones and prototypes from every DIGITAL team.</p></div></section>' +
      '<section class="section"><div class="wrap">' + filters + cards + log + '</div></section>' +
      '<section class="section flush"><div class="wrap join"><h2 class="h2">Build the next update.</h2><a class="button" href="#index">Join us</a></div></section>';
  }

  function post() {
    var p = POSTS[0];
    var words = (p.dek + ' ' + p.sections.map(function (s) { return s[0] + ' ' + s[1]; }).join(' ')).split(/\s+/).length;
    var mins = Math.max(1, Math.round(words / 200));
    var people = p.authors.map(function (n) { return [n, p.mentors.indexOf(n) > -1 ? 'Author · Mentor' : 'Author']; });
    // IDEA 2b: same tag first, then nearest in time; three rows.
    var others = POSTS.filter(function (x) { return x !== p; }).sort(function (a, b) {
      return (b.tag === p.tag) - (a.tag === p.tag) || Math.abs(d(a.date) - d(p.date)) - Math.abs(d(b.date) - d(p.date));
    }).slice(0, 3);
    return '<article class="section"><div class="wrap">' +
      '<nav aria-label="Breadcrumb"><ol class="crumbs"><li><a href="#index">Updates</a></li><li aria-current="page">' + p.type + '</li></ol></nav>' +
      '<h1 class="postTitle enter">' + esc(p.title) + '</h1><p class="lead enter">' + esc(p.dek) + '</p>' +
      '<div class="postByline">' + chip(p) + '<span class="meta">' + fmt(p.date) + ' · ' + mins + ' min read · Coming soon</span>' +
      '<ul class="people">' + people.map(function (x) { return '<li class="person"><span class="av" aria-hidden="true">' + initials(x[0]) + '</span><span><b>' + esc(x[0]) + '</b><small>' + x[1] + '</small></span></li>'; }).join('') + '</ul></div>' +
      '<div class="prose">' + p.sections.map(function (s) {
        return '<section><h2>' + esc(s[0]) + '</h2><p>' + esc(s[1]) + '</p>' + (s[2] ? '<ul class="flow" aria-label="Value stream">' + p.flow.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ul>' : '') + '</section>';
      }).join('') + '</div>' +
      '<a class="textLink" href="#post">Read the post on LinkedIn<span aria-hidden="true"> ↗</span></a>' +
      '<section class="next" aria-labelledby="next-h"><h2 id="next-h">More updates</h2><ul class="rows">' + others.map(function (x) { return row(x); }).join('') + '</ul>' +
      '<a class="textLink" href="#index">All updates</a></section>' +
      '</div></article>';
  }

  var app = document.getElementById('app');
  var wide = window.matchMedia('(min-width: 735px)');
  function render(keepFocus) {
    var isPost = location.hash === '#post';
    if (wide.matches) state.more = true;
    app.innerHTML = isPost ? post() : index();
    document.getElementById('p-index').toggleAttribute('aria-current', !isPost);
    document.getElementById('p-post').toggleAttribute('aria-current', isPost);
    if (keepFocus) { var el = app.querySelector(keepFocus); if (el) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); } }
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]');
    if (!b) return;
    var k = b.dataset.k, v = b.dataset.v || null;
    if (k === 'tag' && !v) state.type = null;
    state[k] = state[k] === v ? null : v;
    render('button[data-k="' + k + '"][data-v="' + (b.dataset.v || '') + '"]');
  });
  app.addEventListener('input', function (e) { if (e.target.id === 'q') { state.q = e.target.value; render('#q'); } });
  app.addEventListener('toggle', function (e) { if (e.target.matches && e.target.matches('.more')) state.more = e.target.open; }, true);
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  wide.addEventListener('change', function () { render(); });
  render();
})();
</script>
</body>
</html>
