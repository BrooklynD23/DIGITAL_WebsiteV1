name: Promote to deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    name: Fast-forward deployment
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward deployment to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAIN_SHA="${{ github.event.workflow_run.head_sha }}"
          git fetch origin main deployment 2>/dev/null || git fetch origin main

          if git show-ref --verify --quiet refs/remotes/origin/deployment; then
            git checkout deployment
            git merge --ff-only "$MAIN_SHA"
          else
            git checkout -B deployment "$MAIN_SHA"
          fi

          git push origin deployment
